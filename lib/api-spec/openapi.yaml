openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: EMMECTY Nursery & Primary School management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and current user
  - name: dashboard
    description: Role-aware overview data
  - name: students
    description: Student records
  - name: attendance
    description: Attendance records and summaries
  - name: finance
    description: Fees and payments
  - name: communication
    description: Announcements
  - name: academics
    description: Timetable and report cards
  - name: academicLifecycle
    description: Academic years, enrollments, fees, and rollover history
  - name: operations
    description: Role-filtered school operations
  - name: settings
    description: School configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a role-specific identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not signed in
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the current user's profile and credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid profile details or current password
        "401":
          description: Not signed in
        "409":
          description: Username already in use
  /support/auth/login:
    post:
      operationId: supportLogin
      tags: [support]
      summary: Sign in to the restricted cross-school pupil support workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportLoginInput"
      responses:
        "200":
          description: Support session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "400":
          description: Invalid support credentials
        "401":
          description: Invalid support credentials
        "429":
          description: Too many sign-in attempts
        "503":
          description: Support access is not configured
  /support/auth/logout:
    post:
      operationId: supportLogout
      tags: [support]
      summary: Sign out of the support workspace
      responses:
        "200":
          description: Support session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /support/auth/me:
    get:
      operationId: getSupportSession
      tags: [support]
      summary: Check the restricted support session
      responses:
        "200":
          description: Active support session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "401":
          description: Not signed in to support
  /support/pupils:
    get:
      operationId: listSupportPupils
      tags: [support]
      summary: Search pupil identity records across schools
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Matching pupil identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportPupilList"
        "401":
          description: Not signed in to support
  /support/pupils/{studentId}:
    delete:
      operationId: deleteSupportPupil
      tags: [support]
      summary: Permanently delete a pupil and all pupil-linked records
      parameters:
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportDeletePupilInput"
      responses:
        "200":
          description: Pupil and linked records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportDeletePupilResult"
        "400":
          description: Registration number confirmation did not match
        "401":
          description: Not signed in to support
        "404":
          description: Pupil not found
  /support/sms-allowance:
    get:
      operationId: getSupportSmsAllowance
      tags: [support]
      summary: View the school's SMS allowance and support adjustment audit
      responses:
        "200":
          description: SMS allowance and recent support adjustments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSmsAllowance"
        "401":
          description: Not signed in to support
    post:
      operationId: adjustSupportSmsAllowance
      tags: [support]
      summary: Grant or adjust the school's prepaid SMS message allowance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsAllowanceAdjustmentInput"
      responses:
        "200":
          description: Updated SMS allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSmsAllowance"
        "400":
          description: Invalid adjustment or insufficient remaining balance
        "401":
          description: Not signed in to support
  /support/sms-reconciliation:
    get:
      operationId: listSupportSmsReconciliations
      tags: [support]
      summary: List SMS deliveries whose provider outcome needs reconciliation
      responses:
        "200":
          description: Ambiguous or stuck SMS reservations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSmsReconciliationList"
        "401":
          description: Not signed in to support
  /support/sms-reconciliation/{deliveryId}:
    parameters:
      - in: path
        name: deliveryId
        required: true
        schema:
          type: string
    post:
      operationId: reconcileSupportSmsDelivery
      tags: [support]
      summary: Resolve an ambiguous SMS reservation after checking provider status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsDeliveryReconciliationInput"
      responses:
        "200":
          description: Reconciliation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid reconciliation or delivery is not pending
        "401":
          description: Not signed in to support
  /sms/allowance:
    get:
      operationId: getSmsAllowance
      tags: [communication]
      summary: View the school's remaining prepaid SMS messages
      responses:
        "200":
          description: Remaining and in-flight SMS message counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsAllowanceBalance"
        "401":
          description: Not signed in
  /users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List school user accounts for authorized administrators
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"
        "403":
          description: Administrator access required
    post:
      operationId: createUser
      tags: [auth]
      summary: Create a school user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid account details
        "403":
          description: Administrator access required
        "409":
          description: Identifier already in use
  /users/{userId}:
    patch:
      operationId: updateUserProfileByAdmin
      tags: [auth]
      summary: Update a school user account
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAdminProfileUpdate"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "403":
          description: Administrator access required
        "404":
          description: Account not found
        "409":
          description: Account update conflict
    delete:
      operationId: deleteUser
      tags: [auth]
      summary: Delete a school user account
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Super Admin access required
        "404":
          description: Account not found
  /users/{userId}/permissions:
    patch:
      operationId: updateUserPermissions
      tags: [auth]
      summary: Update user permissions and class assignments
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPermissionsInput"
      responses:
        "200":
          description: Permissions updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "403":
          description: Administrator access required
        "404":
          description: Account not found
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get role-aware dashboard data
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: Search and filter students
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: className
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Register a pupil and generate a permanent registration number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Registered student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{studentId}/admission-form:
    get:
      operationId: getAdmissionForm
      tags: [students]
      summary: Get the saved admission form for a pupil
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Saved pupil admission form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionForm"
        "404":
          description: Admission form not found
  /students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student profile
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Student not found
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a pupil record and linked pupil account password
      parameters:
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdateInput"
      responses:
        "200":
          description: Updated pupil profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "403":
          description: Administrator access required
        "404":
          description: Student not found
  /attendance:
    get:
      operationId: getAttendance
      tags: [attendance]
      summary: Get attendance for a class and date
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: className
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Attendance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: saveAttendance
      tags: [attendance]
      summary: Save daily attendance for one student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: Saved attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
  /attendance/create:
    post:
      operationId: createAttendanceRegister
      tags: [attendance]
      summary: Create an attendance register for a class and date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterInput"
      responses:
        "201":
          description: Created attendance register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
  /attendance/deleted:
    get:
      operationId: getDeletedAttendanceRegisters
      tags: [attendance]
      summary: Get deleted attendance registers and their reasons
      responses:
        "200":
          description: Deleted attendance registers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeletedAttendanceRegister"
  /attendance/register:
    delete:
      operationId: deleteAttendanceRegister
      tags: [attendance]
      summary: Delete an attendance register with a reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAttendanceRegisterInput"
      responses:
        "200":
          description: Deleted attendance register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedAttendanceRegister"
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Get fee collection summary
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /finance/payments:
    get:
      operationId: listPayments
      tags: [finance]
      summary: List recent fee payments
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: recordPayment
      tags: [finance]
      summary: Record a fee payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Recorded payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /finance/payments/{paymentId}:
    patch:
      operationId: updatePayment
      tags: [finance]
      summary: Update a fee payment and recalculate the pupil balance
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdateInput"
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /finance/expenses:
    get:
      operationId: listExpenses
      tags: [finance]
      summary: List school expenses
      responses:
        "200":
          description: Expense list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationExpense"
    post:
      operationId: createExpense
      tags: [finance]
      summary: Add a school expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationExpense"
  /finance/expenses/{expenseId}/approve:
    patch:
      operationId: approveExpense
      tags: [finance]
      summary: Approve a pending school expense
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationExpense"
        "403":
          description: Approval permission required
  /finance/expenses/{expenseId}:
    delete:
      operationId: deleteExpense
      tags: [finance]
      summary: Delete a school expense
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Expense deleted
        "403":
          description: Delete permission required
  /finance/salaries:
    get:
      operationId: listSalaries
      tags: [finance]
      summary: List salary payments
      responses:
        "200":
          description: Salary payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryPayment"
    post:
      operationId: createSalaryPayment
      tags: [finance]
      summary: Record a salary payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaryPaymentInput"
      responses:
        "201":
          description: Salary payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryPayment"
  /finance/salary-staff:
    get:
      operationId: listSalaryStaff
      tags: [finance]
      summary: List registered teachers and staff with monthly salaries
      responses:
        "200":
          description: Registered salary accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryStaffAccount"
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [communication]
      summary: List announcements visible to the current role
      responses:
        "200":
          description: Announcement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [communication]
      summary: Create a school announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /communications/message-recipients:
    get:
      operationId: listMessageRecipients
      tags: [communication]
      summary: List teachers, pupils, and guardian contacts available for messaging
      responses:
        "200":
          description: Message recipients available to an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRecipients"
        "401":
          description: Not signed in
        "403":
          description: Administrator access required
  /communications/direct-message:
    post:
      operationId: sendDirectMessage
      tags: [communication]
      summary: Send a school-branded SMS to selected teachers and parents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectMessageInput"
      responses:
        "200":
          description: Provider acceptance and delivery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessageResult"
        "400":
          description: Invalid recipients or a message exceeding one SMS segment
        "401":
          description: Not signed in
        "403":
          description: Administrator access required
  /academic/years:
    get:
      operationId: listAcademicYears
      tags: [academicLifecycle]
      summary: List academic years and their three terms
      responses:
        "200":
          description: Academic years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicYear"
    post:
      operationId: createAcademicYear
      tags: [academicLifecycle]
      summary: Create an academic year and its three planned terms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearInput"
      responses:
        "201":
          description: Created or existing academic year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
  /academic/years/{yearId}/import-current:
    post:
      operationId: importCurrentEnrollments
      tags: [academicLifecycle]
      summary: Add current existing pupil profiles to an academic year once
      parameters:
        - $ref: "#/components/parameters/AcademicYearId"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentImportResult"
  /academic/years/{yearId}/enrollments:
    get:
      operationId: listAcademicEnrollments
      tags: [academicLifecycle]
      summary: List current and former enrollments for an academic year
      parameters:
        - $ref: "#/components/parameters/AcademicYearId"
      responses:
        "200":
          description: Academic enrollment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicEnrollment"
  /academic/enrollments:
    post:
      operationId: createAcademicEnrollment
      tags: [academicLifecycle]
      summary: Enroll an existing pupil profile without creating another pupil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicEnrollmentInput"
      responses:
        "201":
          description: Academic enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicEnrollment"
        "409":
          description: Pupil already has an enrollment for the year
  /academic/terms/{termId}/open:
    post:
      operationId: openAcademicTerm
      tags: [academicLifecycle]
      summary: Generate scheduled charges atomically and open a dated academic term
      parameters:
        - $ref: "#/components/parameters/AcademicTermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAcademicTermInput"
      responses:
        "200":
          description: Open term after applying its complete fee schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTerm"
        "409":
          description: Missing schedule, conflicting charge, or invalid date range
  /academic/terms/{termId}:
    put:
      operationId: updateAcademicTerm
      tags: [academicLifecycle]
      summary: Update dates for a planned academic term
      parameters:
        - $ref: "#/components/parameters/AcademicTermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicTermDatesInput"
      responses:
        "200":
          description: Updated planned term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTerm"
        "409":
          description: Term is no longer editable or dates conflict with another term
  /academic/terms/{termId}/close:
    post:
      operationId: closeAcademicTerm
      tags: [academicLifecycle]
      summary: Close a term while preserving all financial and enrollment history
      parameters:
        - $ref: "#/components/parameters/AcademicTermId"
      responses:
        "200":
          description: Closed term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTerm"
  /academic/terms/{termId}/charges:
    get:
      operationId: getTermFeeStatement
      tags: [academicLifecycle]
      summary: Get term charges, allocations, and outstanding amounts
      parameters:
        - $ref: "#/components/parameters/AcademicTermId"
      responses:
        "200":
          description: Term fee statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermStatement"
    post:
      operationId: createAcademicFeeCharge
      tags: [academicLifecycle]
      summary: Create an idempotent term-specific fee charge
      parameters:
        - $ref: "#/components/parameters/AcademicTermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicFeeChargeInput"
      responses:
        "201":
          description: Fee charge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicFeeCharge"
        "409":
          description: Duplicate or inconsistent charge
  /academic/terms/{termId}/fee-schedules:
    get:
      operationId: listAcademicTermFeeSchedules
      tags: [academicLifecycle, finance]
      summary: List administrator-configured fee schedule lines for a term
      parameters:
        - $ref: "#/components/parameters/AcademicTermId"
      responses:
        "200":
          description: Fee schedule lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicFeeSchedule"
    put:
      operationId: upsertAcademicTermFeeSchedule
      tags: [academicLifecycle, finance]
      summary: Create or update one class, stream, and enrollment-type fee schedule line
      parameters:
        - $ref: "#/components/parameters/AcademicTermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicFeeScheduleInput"
      responses:
        "200":
          description: Configured fee schedule line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicFeeSchedule"
        "409":
          description: Schedule is locked or the term cannot be changed
  /academic/charges/{chargeId}/payments:
    post:
      operationId: recordAcademicPayment
      tags: [academicLifecycle, finance]
      summary: Record a payment explicitly against an original term charge
      parameters:
        - $ref: "#/components/parameters/AcademicChargeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicPaymentInput"
      responses:
        "201":
          description: Payment and term allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPayment"
        "409":
          description: Amount exceeds the charge balance
  /academic/payments/{paymentId}/allocations:
    post:
      operationId: allocateExistingAcademicPayment
      tags: [academicLifecycle, finance]
      summary: Explicitly allocate an unassigned legacy payment to an original term charge
      parameters:
        - $ref: "#/components/parameters/LegacyPaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyPaymentAllocationInput"
      responses:
        "201":
          description: Explicit payment allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPayment"
        "404":
          description: Legacy payment not found
        "409":
          description: Allocation conflicts with the receipt or term charge
  /academic/charges/{chargeId}/adjustments:
    post:
      operationId: createAcademicAdjustment
      tags: [academicLifecycle, finance]
      summary: Record an authorized, audited financial adjustment
      parameters:
        - $ref: "#/components/parameters/AcademicChargeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicAdjustmentInput"
      responses:
        "201":
          description: Audited financial adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicAdjustment"
  /academic/enrollments/{enrollmentId}/departure:
    post:
      operationId: recordAcademicDeparture
      tags: [academicLifecycle]
      summary: Transfer or withdraw an enrollment without deleting records or balances
      parameters:
        - $ref: "#/components/parameters/AcademicEnrollmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicDepartureInput"
      responses:
        "200":
          description: Former enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicEnrollment"
  /academic/promotion-cycles:
    post:
      operationId: createPromotionCycle
      tags: [academicLifecycle]
      summary: Open a review cycle and prepare one following year for decisions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionCycleInput"
      responses:
        "201":
          description: Review cycle with pending decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionCycle"
  /academic/promotion-cycles/{cycleId}/decisions:
    get:
      operationId: listPromotionDecisions
      tags: [academicLifecycle]
      summary: Review promotion decisions for every active pupil
      parameters:
        - $ref: "#/components/parameters/PromotionCycleId"
      responses:
        "200":
          description: Promotion review rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromotionReviewRow"
  /academic/promotion-cycles/{cycleId}/decisions/{enrollmentId}:
    put:
      operationId: updatePromotionDecision
      tags: [academicLifecycle]
      summary: Set a reviewed promotion, repetition, transfer, withdrawal, or graduation decision
      parameters:
        - $ref: "#/components/parameters/PromotionCycleId"
        - $ref: "#/components/parameters/AcademicEnrollmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionDecisionInput"
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionDecision"
  /academic/promotion-cycles/{cycleId}/confirm:
    post:
      operationId: confirmPromotionCycle
      tags: [academicLifecycle]
      summary: Confirm reviewed decisions and create eligible new-year enrollments once
      parameters:
        - $ref: "#/components/parameters/PromotionCycleId"
      responses:
        "200":
          description: Confirmed rollover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionConfirmation"
        "409":
          description: One or more pupils are still awaiting a decision
  /academic/dashboard:
    get:
      operationId: getAcademicDashboard
      tags: [academicLifecycle]
      summary: Get real term finance and promotion summaries for a year
      parameters:
        - name: academicYearId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Academic lifecycle dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicDashboard"
  /academic/students/{studentId}/history:
    get:
      operationId: getStudentAcademicHistory
      tags: [academicLifecycle]
      summary: View a pupil's preserved enrollments, fee charges, and allocations
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Academic and finance history for the permanent pupil profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAcademicHistory"
  /academics/timetable:
    get:
      operationId: getTimetable
      tags: [academics]
      summary: Get the current user's timetable
      responses:
        "200":
          description: Timetable entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimetableEntry"
    post:
      operationId: createTimetableEntry
      tags: [academics]
      summary: Create a timetable entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimetableInput"
      responses:
        "201":
          description: Created timetable entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimetableEntry"
  /academics/report-cards/{studentId}:
    get:
      operationId: getReportCard
      tags: [academics]
      summary: Get a student's current term report card
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Report card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCard"
    post:
      operationId: createReportCard
      tags: [academics]
      summary: Create or update a pupil report card
      parameters:
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCardInput"
      responses:
        "201":
          description: Saved report card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCard"
        "403":
          description: Teacher is not assigned to the pupil's class
  /operations:
    post:
      operationId: createClass
      tags: [operations]
      summary: Create a school class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationClass"
        "400":
          description: Invalid class details
        "403":
          description: Administrator access required
        "409":
          description: Class already exists
    get:
      operationId: getOperations
      tags: [operations]
      summary: Get role-filtered school operations
      responses:
        "200":
          description: Operations visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsOverview"
        "401":
          description: Not signed in
  /operations/events:
    post:
      operationId: createEvent
      tags: [operations]
      summary: Add a school event or public holiday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationEvent"
        "403":
          description: Administrator access required
  /operations/subjects:
    get:
      operationId: listSubjects
      tags: [operations]
      summary: List subjects visible to the current user
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationSubject"
        "401":
          description: Not signed in
    post:
      operationId: createSubject
      tags: [operations]
      summary: Create a subject for a class and teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Subject created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationSubject"
        "400":
          description: Invalid subject
        "403":
          description: Subject management access required
        "409":
          description: Duplicate subject assignment
  /operations/subjects/{subjectId}:
    patch:
      operationId: updateSubject
      tags: [operations]
      summary: Update a subject assignment
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "200":
          description: Subject updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationSubject"
        "403":
          description: Subject management access required
        "404":
          description: Subject not found
        "409":
          description: Duplicate subject assignment
    delete:
      operationId: deleteSubject
      tags: [operations]
      summary: Remove a subject assignment
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Subject removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Subject management access required
        "404":
          description: Subject not found
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get school settings
      responses:
        "200":
          description: Current school settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update school settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolSettingsUpdate"
      responses:
        "200":
          description: Updated school settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"
        "403":
          description: Administrator access required
  /settings/fee-reminder-sms-authorization:
    patch:
      operationId: updateFeeReminderSmsAuthorization
      tags: [settings]
      summary: Set standing authorization for monthly fee-balance SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeReminderSmsAuthorizationInput"
      responses:
        "200":
          description: Updated fee-reminder SMS authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeReminderSmsAuthorization"
        "403":
          description: Administrator access required
  /backups:
    get:
      operationId: listBackups
      tags: [backups]
      summary: List administrator backup files
      responses:
        "200":
          description: Backup history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupSummary"
        "403":
          description: Administrator access required
  /backups/full:
    post:
      operationId: createFullBackup
      tags: [backups]
      summary: Create and store a complete school backup
      responses:
        "201":
          description: Full backup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullBackupResponse"
        "403":
          description: Administrator access required
  /backups/{backupId}/download:
    get:
      operationId: downloadBackup
      tags: [backups]
      summary: Download an administrator backup file
      parameters:
        - name: backupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the private backup file
        "403":
          description: Administrator access required
        "404":
          description: Backup not found
components:
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: string
    AcademicYearId:
      name: yearId
      in: path
      required: true
      schema:
        type: string
    AcademicTermId:
      name: termId
      in: path
      required: true
      schema:
        type: string
    AcademicEnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
    AcademicChargeId:
      name: chargeId
      in: path
      required: true
      schema:
        type: string
    LegacyPaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    PromotionCycleId:
      name: cycleId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Role:
      type: string
      enum: [super_admin, administrator, teacher, accountant, secretary, librarian, nurse, guardian, student, staff]
    LoginInput:
      type: object
      properties:
        userType:
          type: string
          enum: [staff, learner]
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [userType, identifier, password]
    SupportLoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 200
      required: [password]
    SupportSession:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
      required: [expiresAt]
    SmsAllowanceBalance:
      type: object
      properties:
        availableMessages:
          type: number
          multipleOf: 1
          minimum: 0
        reservedMessages:
          type: number
          multipleOf: 1
          minimum: 0
        sentMessages:
          type: number
          multipleOf: 1
          minimum: 0
      required: [availableMessages, reservedMessages, sentMessages]
    SmsAllowanceAdjustmentInput:
      type: object
      properties:
        messages:
          type: number
          multipleOf: 1
          minimum: -1000000
          maximum: 1000000
          not:
            const: 0
        note:
          type: string
          maxLength: 500
      required: [messages, note]
    SupportSmsAllowance:
      allOf:
        - $ref: "#/components/schemas/SmsAllowanceBalance"
        - type: object
          properties:
            schoolName:
              type: string
            adjustments:
              type: array
              items:
                $ref: "#/components/schemas/SmsAllowanceAuditEntry"
          required: [schoolName, adjustments]
    SmsAllowanceAuditEntry:
      type: object
      properties:
        messages:
          type: number
          multipleOf: 1
        note:
          type: string
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
      required: [messages, note, actor, occurredAt]
    SupportSmsReconciliationList:
      type: object
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/SupportSmsReconciliation"
        resolutions:
          type: array
          items:
            $ref: "#/components/schemas/SupportSmsReconciliationAudit"
      required: [deliveries, resolutions]
    SupportSmsReconciliation:
      type: object
      properties:
        id:
          type: string
        channel:
          type: string
        recipientCount:
          type: number
          multipleOf: 1
          minimum: 1
        status:
          type: string
          enum: [sending, reconciliation_required]
        occurredAt:
          type: string
          format: date-time
        failureCode:
          type: string
      required: [id, channel, recipientCount, status, occurredAt]
    SupportSmsReconciliationAudit:
      type: object
      properties:
        deliveryId:
          type: string
        outcome:
          type: string
          enum: [sent, failed]
        messages:
          type: number
          multipleOf: 1
          minimum: 1
        note:
          type: string
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
      required: [deliveryId, outcome, messages, note, actor, occurredAt]
    SmsDeliveryReconciliationInput:
      type: object
      properties:
        outcome:
          type: string
          enum: [sent, failed]
        note:
          type: string
          minLength: 1
          maxLength: 500
      required: [outcome, note]
    SupportPupil:
      type: object
      properties:
        id:
          type: string
        schoolName:
          type: string
        registrationNumber:
          type: string
        name:
          type: string
        className:
          type: string
        stream:
          type: string
        status:
          type: string
          enum: [active, inactive]
        isSponsored:
          type: boolean
      required: [id, schoolName, registrationNumber, name, className, stream, status, isSponsored]
    SupportPupilList:
      type: object
      properties:
        pupils:
          type: array
          items:
            $ref: "#/components/schemas/SupportPupil"
      required: [pupils]
    SupportDeletePupilInput:
      type: object
      properties:
        confirmRegistrationNumber:
          type: string
          minLength: 1
          maxLength: 100
      required: [confirmRegistrationNumber]
    SupportDeletePupilResult:
      type: object
      properties:
        message:
          type: string
        deletedAttendanceRecords:
          type: number
          minimum: 0
        deletedPaymentRecords:
          type: number
          minimum: 0
        deletedLinkedAccounts:
          type: number
          minimum: 0
        deletedLinkedRecords:
          type: number
          minimum: 0
        photoStatus:
          type: string
          enum: [removed, not_present, shared, failed]
      required: [message, deletedAttendanceRecords, deletedPaymentRecords, deletedLinkedAccounts, deletedLinkedRecords, photoStatus]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        identifier:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [active, inactive]
        department:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        assignedClasses:
          type: array
          items:
            type: string
        monthlySalary:
          type: number
          minimum: 0
        role:
          $ref: "#/components/schemas/Role"
        initials:
          type: string
        schoolName:
          type: string
        studentId:
          type: ["string", "null"]
        isSupport:
          type: boolean
      required: [id, name, identifier, email, phone, status, role, permissions, initials, schoolName]
    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        identifier:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        department:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    UserAccountInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"
        userType:
          type: string
          enum: [staff, learner]
        studentId:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: string
        department:
          type: string
        monthlySalary:
          type: number
          minimum: 0
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
      required: [name, identifier, password, role, userType]
    UserAdminProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        identifier:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        newPassword:
          type: string
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: [active, inactive]
        department:
          type: string
        studentId:
          type: ["string", "null"]
        monthlySalary:
          type: number
          minimum: 0
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        assignedClasses:
          type: array
          items:
            type: string
    UserPermissionsInput:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        assignedClasses:
          type: array
          items:
            type: string
      required: [permissions]
    PermissionKey:
      type: string
      enum: [expense_approve, expense_delete, transactions_view, transactions_print, finance_view, payments_manage, expenses_view, users_view, users_manage, subjects_view, subjects_manage, subjects_delete]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        expiresAt:
          type: string
      required: [user, expiresAt]
    Student:
      type: object
      properties:
        id:
          type: string
        registrationNumber:
          type: string
        name:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        admissionDate:
          type: string
        className:
          type: string
        stream:
          type: string
        gender:
          type: string
        status:
          type: string
          enum: [active, inactive]
        attendancePercentage:
          type: number
        feeBalance:
          type: number
        avatarTone:
          type: string
        photoPath:
          type: string
        enrollmentType:
          type: string
          enum: [day, boarding]
        isSponsored:
          type: boolean
        termFee:
          type: number
        amountPaid:
          type: number
        previousFeeBalance:
          type: number
        receiptNumber:
          type: string
        admissionForm:
