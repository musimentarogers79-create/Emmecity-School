openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: EMMECTY Nursery & Primary School management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and current user
  - name: dashboard
    description: Role-aware overview data
  - name: students
    description: Student records
  - name: attendance
    description: Attendance records and summaries
  - name: finance
    description: Fees and payments
  - name: communication
    description: Announcements
  - name: academics
    description: Timetable and report cards
  - name: operations
    description: Role-filtered school operations
  - name: settings
    description: School configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a role-specific identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not signed in
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the current user's profile and credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid profile details or current password
        "401":
          description: Not signed in
        "409":
          description: Username already in use
  /users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List school user accounts for administrator management
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"
        "403":
          description: Administrator access required
    post:
      operationId: createUser
      tags: [auth]
      summary: Create a staff, teacher, accountant, guardian, or pupil account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "403":
          description: Administrator access required
  /users/{userId}/permissions:
    patch:
      operationId: updateUserPermissions
      tags: [auth]
      summary: Update the action permissions for a school user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPermissionsInput"
      responses:
        "200":
          description: Updated user account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "403":
          description: Administrator access required
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get role-aware dashboard data
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: Search and filter students
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: className
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Register a pupil and generate a permanent registration number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Registered student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student profile
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Student not found
  /attendance:
    get:
      operationId: getAttendance
      tags: [attendance]
      summary: Get attendance for a class and date
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: className
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Attendance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: saveAttendance
      tags: [attendance]
      summary: Save daily attendance for one student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: Saved attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
  /attendance/create:
    post:
      operationId: createAttendanceRegister
      tags: [attendance]
      summary: Create an attendance register for a class and date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterInput"
      responses:
        "201":
          description: Created attendance register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Get fee collection summary
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /finance/payments:
    get:
      operationId: listPayments
      tags: [finance]
      summary: List recent fee payments
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: recordPayment
      tags: [finance]
      summary: Record a fee payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Recorded payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /finance/expenses:
    get:
      operationId: listExpenses
      tags: [finance]
      summary: List school expenses
      responses:
        "200":
          description: Expense list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationExpense"
    post:
      operationId: createExpense
      tags: [finance]
      summary: Add a school expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationExpense"
  /finance/expenses/{expenseId}/approve:
    patch:
      operationId: approveExpense
      tags: [finance]
      summary: Approve a pending school expense
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationExpense"
        "403":
          description: Approval permission required
  /finance/expenses/{expenseId}:
    delete:
      operationId: deleteExpense
      tags: [finance]
      summary: Delete a school expense
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Expense deleted
        "403":
          description: Delete permission required
  /finance/salaries:
    get:
      operationId: listSalaries
      tags: [finance]
      summary: List salary payments
      responses:
        "200":
          description: Salary payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryPayment"
    post:
      operationId: createSalaryPayment
      tags: [finance]
      summary: Record a salary payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaryPaymentInput"
      responses:
        "201":
          description: Salary payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryPayment"
  /finance/salary-staff:
    get:
      operationId: listSalaryStaff
      tags: [finance]
      summary: List registered teachers and staff with monthly salaries
      responses:
        "200":
          description: Registered salary accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryStaffAccount"
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [communication]
      summary: List announcements visible to the current role
      responses:
        "200":
          description: Announcement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [communication]
      summary: Create a school announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /academics/timetable:
    get:
      operationId: getTimetable
      tags: [academics]
      summary: Get the current user's timetable
      responses:
        "200":
          description: Timetable entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimetableEntry"
    post:
      operationId: createTimetableEntry
      tags: [academics]
      summary: Create a timetable entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimetableInput"
      responses:
        "201":
          description: Created timetable entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimetableEntry"
  /academics/report-cards/{studentId}:
    get:
      operationId: getReportCard
      tags: [academics]
      summary: Get a student's current term report card
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Report card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCard"
  /operations:
    post:
      operationId: createClass
      tags: [operations]
      summary: Create a school class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationClass"
        "400":
          description: Invalid class details
        "403":
          description: Administrator access required
        "409":
          description: Class already exists
    get:
      operationId: getOperations
      tags: [operations]
      summary: Get role-filtered school operations
      responses:
        "200":
          description: Operations visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsOverview"
        "401":
          description: Not signed in
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get school settings
      responses:
        "200":
          description: Current school settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update school settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolSettingsUpdate"
      responses:
        "200":
          description: Updated school settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"
        "403":
          description: Administrator access required
components:
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Role:
      type: string
      enum: [super_admin, administrator, teacher, accountant, guardian, student, staff]
    LoginInput:
      type: object
      properties:
        userType:
          type: string
          enum: [staff, learner]
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [userType, identifier, password]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        identifier:
          type: string
        email:
          type: string
        phone:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        assignedClasses:
          type: array
          items:
            type: string
        monthlySalary:
          type: number
          minimum: 0
        role:
          $ref: "#/components/schemas/Role"
        initials:
          type: string
        schoolName:
          type: string
        studentId:
          type: ["string", "null"]
      required: [id, name, identifier, email, phone, role, permissions, initials, schoolName]
    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        identifier:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    UserAccountInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"
        userType:
          type: string
          enum: [staff, learner]
        studentId:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        nextOfKin:
          type: string
        hireDate:
          type: string
        employmentType:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        assignedClasses:
          type: array
          items:
            type: string
        monthlySalary:
          type: number
          minimum: 0
      required: [name, identifier, password, role, userType]
    UserPermissionsInput:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        assignedClasses:
          type: array
          items:
            type: string
      required: [permissions]
    PermissionKey:
      type: string
      enum: [expense_approve, expense_delete, transactions_view, transactions_print, finance_view, expenses_view, manage_users]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        expiresAt:
          type: string
      required: [user, expiresAt]
    Student:
      type: object
      properties:
        id:
          type: string
        registrationNumber:
          type: string
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        className:
          type: string
        stream:
          type: string
        gender:
          type: string
        status:
          type: string
          enum: [active, inactive]
        attendancePercentage:
          type: number
        feeBalance:
          type: number
        avatarTone:
          type: string
        enrollmentType:
          type: string
          enum: [day, boarding]
        termFee:
          type: number
        amountPaid:
          type: number
        receiptNumber:
          type: string
      required: [id, registrationNumber, name, firstName, lastName, className, stream, gender, status, attendancePercentage, feeBalance, avatarTone, enrollmentType, termFee, amountPaid]
    StudentInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        middleName:
          type: string
        lastName:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
        gender:
          type: string
        className:
          type: string
        stream:
          type: string
        guardianName:
          type: string
        guardianPhone:
          type: string
        enrollmentType:
          type: string
          enum: [day, boarding]
        termFee:
          type: number
          minimum: 0
        initialPayment:
          type: number
          minimum: 0
        paymentMethod:
          type: string
        paymentReference:
          type: string
      required: [firstName, lastName, dateOfBirth, gender, className, stream, guardianName, guardianPhone, enrollmentType, termFee]
    StudentProfile:
      allOf:
        - $ref: "#/components/schemas/Student"
        - type: object
          properties:
            dateOfBirth:
              type: string
            guardianName:
              type: string
            guardianPhone:
              type: string
            guardianEmail:
              type: string
            admissionDate:
              type: string
            academicHistory:
              type: array
              items:
                type: object
                properties:
                  term:
                    type: string
                  average:
                    type: number
                  grade:
                    type: string
                required: [term, average, grade]
          required: [dateOfBirth, guardianName, guardianPhone, guardianEmail, admissionDate, academicHistory]
    AttendanceStatus:
      type: string
      enum: [present, absent, late, excused]
    AttendanceRecord:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        studentName:
          type: string
        registrationNumber:
          type: string
        className:
          type: string
        date:
          type: string
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        arrivalTime:
          type: ["string", "null"]
      required: [id, studentId, studentName, registrationNumber, className, date, status]
    AttendanceInput:
      type: object
      properties:
        studentId:
          type: string
        date:
          type: string
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        arrivalTime:
          type: ["string", "null"]
      required: [studentId, date, status]
    AttendanceRegisterInput:
      type: object
      properties:
        date:
          type: string
        className:
          type: string
      required: [date, className]
    Payment:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        receiptNumber:
          type: string
        studentName:
          type: string
        registrationNumber:
          type: string
        amount:
          type: number
        method:
          type: string
        date:
          type: string
        status:
          type: string
          enum: [completed, pending, reversed]
        balance:
          type: number
      required: [id, studentId, receiptNumber, studentName, registrationNumber, amount, method, date, status, balance]
    PaymentInput:
      type: object
      properties:
        studentId:
          type: string
        amount:
          type: number
          minimum: 1
        method:
          type: string
        reference:
          type: string
      required: [studentId, amount, method, reference]
    ExpenseInput:
      type: object
      properties:
        category:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 1
        date:
          type: string
        reference:
          type: string
      required: [category, description, amount, date]
    SalaryPayment:
      type: object
      properties:
        id:
          type: string
        staffId:
          type: string
        staffName:
          type: string
        monthlySalary:
          type: number
        period:
          type: string
        amount:
          type: number
        balance:
          type: number
        receiptNumber:
          type: string
        paymentDate:
          type: string
        method:
          type: string
        reference:
          type: string
        status:
          type: string
      required: [id, staffId, staffName, monthlySalary, period, amount, balance, receiptNumber, paymentDate, method, reference, status]
    SalaryPaymentInput:
      type: object
      properties:
        staffId:
          type: string
        period:
          type: string
        amount:
          type: number
          minimum: 1
        method:
          type: string
        reference:
          type: string
      required: [staffId, period, amount, method, reference]
    SalaryStaffAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        monthlySalary:
          type: number
      required: [id, name, role, monthlySalary]
    FinanceSummary:
      type: object
      properties:
        collected:
          type: number
        outstanding:
          type: number
        collectionRate:
          type: number
        trend:
          type: number
        monthly:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              amount:
                type: number
            required: [month, amount]
      required: [collected, outstanding, collectionRate, trend, monthly]
    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        audience:
          type: string
        publishedAt:
          type: string
        author:
          type: string
        priority:
          type: string
          enum: [normal, important]
      required: [id, title, body, audience, publishedAt, author, priority]
    AnnouncementInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        audience:
          type: string
        priority:
          type: string
          enum: [normal, important]
      required: [title, body, audience, priority]
    TimetableEntry:
      type: object
      properties:
        id:
          type: string
        day:
          type: string
        time:
          type: string
        subject:
          type: string
        teacher:
          type: string
        className:
          type: string
        room:
          type: string
        accent:
          type: string
      required: [id, day, time, subject, teacher, className, room, accent]
    TimetableInput:
      type: object
      properties:
        day:
          type: string
          minLength: 1
        time:
          type: string
          minLength: 1
        subject:
          type: string
          minLength: 1
        teacher:
          type: string
          minLength: 1
        className:
          type: string
          minLength: 1
        room:
          type: string
          minLength: 1
        accent:
          type: string
      required: [day, time, subject, teacher, className, room]
    ReportCard:
