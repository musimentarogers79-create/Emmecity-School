kind = "web"
previewPath = "/"
title = "SchoolOps"
description = "A secure primary school management platform for administrators, teachers, parents, and students to coordinate daily operations, learning, attendance, communication, and finance."
version = "1.0.0"
id = "artifacts/school-ops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25311

[services.development]
run = "pnpm --filter @workspace/school-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-ops", "run", "build" ]
serve = "static"
publicDir = "artifacts/school-ops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25311"
BASE_PATH = "/"
