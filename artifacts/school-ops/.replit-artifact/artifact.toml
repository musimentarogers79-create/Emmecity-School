kind = "web"
previewPath = "/"
title = "EMMECTY School Management System"
description = "A secure school management platform for EMMECTY NURSERY & PRIMARY SCHOOL, serving administrators, teachers, finance staff, guardians, pupils, and support staff."
version = "1.0.0"
id = "artifacts/school-ops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25311

[services.development]
run = "pnpm --filter @workspace/school-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-ops", "run", "build" ]
serve = "static"
publicDir = "artifacts/school-ops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25311"
BASE_PATH = "/"
